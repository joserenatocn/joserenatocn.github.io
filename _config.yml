# ------------------------------------------------------------
#  Site settings — edit these
# ------------------------------------------------------------
title: "The Bradbury Challenge"
tagline: "52 stories · 1,000 nights"
author: "Jose Renato"
description: "A public log of a year of short stories and a thousand nights of reading."
goal: 52              # stories in the writing challenge
nights_goal: 1000     # nights in the reading challenge
start_date: "2026"    # shown at the top of the homepage

# ------------------------------------------------------------
#  Leave these alone unless you know you want to change them
# ------------------------------------------------------------
url: ""
baseurl: ""
markdown: kramdown

collections:
  stories:
    output: true
    permalink: /week/:name/

defaults:
  - scope:
      path: ""
      type: stories
    values:
      layout: story

exclude:
  - README.md
  - _templates